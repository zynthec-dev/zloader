# Documentation - https://github.com/actions/labeler

# General Labels
'Build | Project System':
  - changed-files:
    - any-glob-to-any-file:
      - '.github/*'
      - '.github/**/*'
      - 'zloader-app/*.xcconfig'
      - 'zloader-app/**/*.xcconfig'
      - 'zloader-app/*.xcodeproj/*'
      - 'zloader-app/**/*.xcodeproj/*'
      - 'zloader-app/Makefile'
      - 'zloader-app/.editorconfig'
      - 'zloader-app/.gitignore'

'Dependencies':
  - changed-files:
    - any-glob-to-any-file:
      - 'zloader-app/Dependencies/*'
      - 'zloader-app/Dependencies/**/*'
      - '.gitmodules'

'Documentation':
  - changed-files:
    - any-glob-to-any-file:
      - '*.md'
      - '**/*.md'
      - 'zloader-app/LICENSE'

'GUI/UIKit':
  - changed-files:
    - any-glob-to-any-file:
      - 'zloader-app/zLoader/Features/Views/*'
      - 'zloader-app/zLoader/Features/Views/**/*'
      - 'zloader-app/zLoader/App/App Detail/*.swift'
      - 'zloader-app/zLoader/App/Browse/*.swift'
      - 'zloader-app/zLoader/App/Authentication/*.swift'
      - 'zloader-app/zLoader/App/My Apps/*.swift'
      - 'zloader-app/zLoader/App/News/*.swift'
      - 'zloader-app/zLoader/App/Settings/*.swift'
      - 'zloader-app/zLoader/App/Sources/*.swift'

'Resources | Assets':
  - changed-files:
    - any-glob-to-any-file:
      - 'zloader-app/zLoader/App/Resources/*'
      - 'zloader-app/zLoader/App/Resources/**/*'
      - 'zloader-app/zLoader/App/Base.lproj/*'
      - 'zloader-app/zLoader/App/Base.lproj/**/*'
      - 'zloader-app/zLoader/Backup/Assets.xcassets/*'
      - 'zloader-app/zLoader/Backup/Assets.xcassets/**/*'
      - 'zloader-app/zLoader/Widget/Assets.xcassets/*'
      - 'zloader-app/zLoader/Widget/Assets.xcassets/**/*'

